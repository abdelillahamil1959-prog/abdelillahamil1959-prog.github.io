
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عبدالإله أميل – خدمات الكتابة والذكاء الاصطناعي</title>

<style>
    body {
        margin: 0;
        font-family: "Cairo", sans-serif;
        background-color: #f7f7f3;
        color: #222;
        line-height: 1.8;
        transition: all 0.3s ease;
    }

    :root {
        --olive-dark: #4b5a33;
        --olive-light: #8a9b66;
        --mountain: #6e7f5f;
        --forest: #4f6b3a;
        --water: #7aa6c2;
        --sun: #d8b45b;
        --earth: #b08f6a;
        --cloud: #d9d9d9;
    }

    header {
        background-color: #ffffff;
        border-bottom: 1px solid #ddd;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* زر اللغة */
    .btn-ar {
        background-color: var(--olive-dark);
        color: #fff;
        padding: 6px 14px;
        border-radius: 50px; /* دائري */
        font-weight: bold;
        cursor: pointer;
    }

    .btn-en {
        background-color: var(--olive-light);
        color: #fff;
        padding: 6px 14px;
        border-radius: 6px; /* مربّع */
        font-weight: bold;
        cursor: pointer;
    }

    nav {
        display: flex;
        gap: 12px;
    }

    /* أشكال القائمة */
    .nav-hilal {
        padding: 6px 14px;
        background-color: var(--forest);
        color: #fff;
        border-radius: 40px 10px;
    }

    .nav-shams {
        padding: 6px 14px;
        background-color: var(--sun);
        color: #fff;
        border-radius: 50%;
    }

    .nav-murabba {
        padding: 6px 14px;
        background-color: var(--earth);
        color: #fff;
        border-radius: 4px;
    }

    .nav-daera {
        padding: 6px 14px;
        background-color: var(--water);
        color: #fff;
        border-radius: 50px;
    }

    .nav-mustatil {
        padding: 6px 20px;
        background-color: var(--mountain);
        color: #fff;
        border-radius: 8px;
    }

    .nav-hada {
        padding: 6px 14px;
        background-color: var(--cloud);
        color: #333;
        border-radius: 0px;
    }

    main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px 80px;
    }

    /* العناوين داخل الصفحة */
    .section-title {
        padding: 10px 16px;
        border-radius: 8px;
        color: #fff;
        margin-bottom: 12px;
        display: inline-block;
    }

    .mountain { background-color: var(--mountain); }
    .forest { background-color: var(--forest); }
    .water { background-color: var(--water); }
    .sun { background-color: var(--sun); }
    .earth { background-color: var(--earth); }
    .cloud { background-color: var(--cloud); color: #333; }

</style>
</head>

<body>

<header>
    <div id="brand">عبدالإله أميل</div>

    <nav>
        <div class="nav-hilal" data-key="home"></div>
        <div class="nav-shams" data-key="about"></div>
        <div class="nav-murabba" data-key="services"></div>
        <div class="nav-daera" data-key="why"></div>
        <div class="nav-mustatil" data-key="order"></div>
        <div class="nav-hada" data-key="contact"></div>
    </nav>

    <div>
        <button class="btn-ar" onclick="setLang('ar')">العربية</button>
        <button class="btn-en" onclick="setLang('en')">English</button>
    </div>
</header>

<main>

    <h2 class="section-title mountain" data-key="title1"></h2>
    <p data-key="text1"></p>

    <h2 class="section-title forest" data-key="title2"></h2>
    <p data-key="text2"></p>

    <h2 class="section-title water" data-key="title3"></h2>
    <p data-key="text3"></p>

    <h2 class="section-title sun" data-key="title4"></h2>
    <p data-key="text4"></p>

    <h2 class="section-title earth" data-key="title5"></h2>
    <p data-key="text5"></p>

    <h2 class="section-title cloud" data-key="title6"></h2>
    <p data-key="text6"></p>

</main>
