
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>خدمات الذكاء الاصطناعي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: "Tahoma", sans-serif;
            background-color: #F7F7F7;
            color: #222;
        }

        .page {
            max-width: 900px;
            margin: auto;
            padding: 30px 16px;
        }

        /* زر اللغة */
        .lang-switch {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .lang-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;

            color: white;

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero-text {
            font-size: 18px;
            color: #555;
            margin-bottom: 35px;
        }

        /* المستطيلات العمودية المتوسطة */
        .services {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .service-box {
            width: 70%;
            background: white;
            padding: 18px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            text-decoration: none;
            color: #333;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: 0.2s;
            text-align: center;
        }

        .service-box:hover {
            background: #EFEFEF;
        }
    </style>
</head>

<body>
<div class="page">

    <!-- زر اللغة -->
    <div class="lang-switch">
        <a href="index.html" class="lang-btn ar-btn">AR</a>

    <!-- العنوان -->
    <h1 class="hero-title">خدمات الذكاء الاصطناعي</h1>
    <p class="hero-text">

    </p>

    <!-- المستطيلات -->
    <div class="services">
        <a href="about.html" class="service-box">من أنا</a>
        <a href="analysis.html" class="service-box">تحليل النصوص</a>
