
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { margin:0; font-family:'Cairo', sans-serif; background:#F7F7F7; color:#222; }
        .page { max-width:900px; margin:auto; padding:30px 16px; }

        h1 { font-size:28px; margin-bottom:15px; }

        .contact-link { color:#4A90E2; font-weight:600; text-decoration:none; }

        .whatsapp-btn {

            background:#25D366; color:white; border-radius:8px;
            text-decoration:none; font-size:18px; font-weight:700;

    </style>

<body>
<div class="page">

</div>

</html>
