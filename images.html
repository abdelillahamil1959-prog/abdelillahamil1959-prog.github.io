
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>

<body>
<div class="page">

    <div class="lang-switch">
        <a href="index.html" class="lang-btn ar-btn">AR</a>
        <a href="english.html" class="lang-btn en-btn">EN</a>
    </div>

    <div class="box">
        <h1>تحليل الصور</h1>
        <p>أقدّم تحليلًا بصريًا دقيقًا للصور، يشمل وصف العناصر، فهم السياق، واستخراج التفاصيل المهمة.</p>
    </div>

</div>

</html>
