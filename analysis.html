
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحليل النصوص</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin:0; font-family: Tahoma, sans-serif; background:#F7F7F7; color:#222; }
        .page { max-width:900px; margin:auto; padding:30px 16px; }

        .lang-switch { display:flex; gap:12px; margin-bottom:25px; }
        .lang-btn {
            width:48px; height:48px; border-radius:50%;
            display:flex; justify-content:center; align-items:center;
            color:white; text-decoration:none; font-size:17px; font-weight:bold;
        }
        .ar-btn { background:#6B7A3A; }
        .en-btn { background:#4A90E2; }

        .box {
            background:white; padding:25px; border-radius:12px;
            border:1px solid #ddd; box-shadow:0 2px 6px rgba(0,0,0,0.05);
        }
        h1 { font-size:28px; margin-bottom:15px; }
        p { font-size:18px; line-height:1.7; color:#444; }
    </style>
</head>

<body>
<div class="page">

    <div class="lang-switch">
        <a href="analysis.html" class="lang-btn ar-btn">AR</a>
        <a href="analysis-en.html" class="lang-btn en-btn">EN</a>
    </div>

    <div class="box">
        <h1>تحليل النصوص</h1>
        <p>
            أقدّم خدمة تحليل النصوص باستخدام الذكاء الاصطناعي، بهدف فهم المعنى العميق،
            واستخراج الأفكار الأساسية، وتحديد الأسلوب والاتجاه العام للنص.
            يشمل التحليل تلخيص النصوص الطويلة، إعادة الصياغة، اكتشاف الأخطاء،
            وتحسين الأسلوب ليصبح النص أكثر وضوحًا وقوة.
        </p>
    </div>

</div>
</body>
</html>
