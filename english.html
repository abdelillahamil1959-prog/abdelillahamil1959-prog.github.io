
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Services</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Tahoma;
            background-color: #F5F5F5;
            color: #222;
        }

        .page {
            max-width: 900px;
            margin: auto;
            padding: 20px 16px 40px;
        }

        .lang-switch {
            display: flex;
            gap: 12px;
            padding: 10px 0 20px;
        }

        .lang-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .ar-btn { background-color: #6B7A3A; }
        .en-btn { background-color: #4A90E2; }

        .hero-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .services {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 25px;
        }

        .service-box {
            background: white;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            color: #333;
            border: 1px solid #ddd;
            transition: 0.2s;
        }

        .service-box:hover {
            background: #e9e9e9;
        }
    </style>
</head>

<body>
<div class="page">

    <div class="lang-switch">
        <a href="index.html" class="lang-btn ar-btn">AR</a>
        <a href="english.html" class="lang-btn en-btn">EN</a>
    </div>

    <h1 class="hero-title">AI Services</h1>

    <div class="services">
        <a href="about.html" class="service-box">About Me</a>
        <a href="analysis.html" class="service-box">Text Analysis</a>
        <a href="images.html" class="service-box">Image Analysis</a>
        <a href="writing.html" class="service-box">Content Writing</a>
    </div>

</div>
</body>
</html>
